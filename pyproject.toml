[project]
name = "py-ftmarkets"
version = "0.8.0"
description = "Financial Times (markets.ft.com) data source for Python"
readme = "README.md"
authors = [
    { name = "Roman Medvedev", email = "pypi@romavm.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "lxml>=6.0.2",
    "pycountry>=24.6.1",
    "pydantic>=2.12.5",
    "pydantic-extra-types>=2.11.0",
    "requests>=2.32.5",
    "urllib3>=2.6.3",
    "pydantic-market-data>=0.10.0",
]

[project.optional-dependencies]
cli = ["treaty==1.0.0rc20; python_version >= '3.14'"]

[project.urls]
Homepage = "https://github.com/romamo/py-ftmarkets"
Repository = "https://github.com/romamo/py-ftmarkets"
Issues = "https://github.com/romamo/py-ftmarkets/issues"

[project.scripts]
ftmarkets = "ftmarkets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ftmarkets"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "uv.lock",
    "implementation_plan.md",
    "tmp",
    ".claude",
    "docs/sessions",
    "CLAUDE.md",
    "GEMINI.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "toml>=0.10.2",
    "ruff>=0.9.2",
    "types-requests>=2.31.0",
    "pandas-stubs>=2.0.0",
    "lxml-stubs>=0.4.0",
    "bandit>=1.8.3",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
markers = [
    "live: hits markets.ft.com; deselected by default, run with `uv run pytest -m live`",
]
addopts = "-m 'not live'"

[tool.mypy]
ignore_missing_imports = true
