name: "Publish"
# https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.10 and 3.14
        run: uv python install 3.10 3.14
      - name: Unit tests (3.10)
        run: |
          uv sync --all-extras --dev --python 3.10
          uv run --python 3.10 pytest
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --python 3.10 --with dist/*.whl tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --python 3.10 --with dist/*.tar.gz tests/smoke_test.py
      - name: CLI from the wheel (3.14, cli extra)
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --python 3.14 --with "py-ftmarkets[cli] @ ./${wheel}" ftmarkets --version
      - name: Publish
        run: uv publish
