name: "Live"
# Integration tests against live markets.ft.com; run by hand, never on push

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev --python 3.10

      - name: Run live tests
        run: uv run pytest -m live
